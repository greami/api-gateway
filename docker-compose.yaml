services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      USER_SERVICE_URL: http://user-service:8082
      CORE_SERVICE_URL: http://core-service:8083
    depends_on:
      - user-service
      - core-service
    networks:
      - backend

  user-service:
    image: user-service:latest
    container_name: user-service
    ports:
      - "8082:8082"
    expose:
      - "8082"
    networks:
      - backend

  core-service:
    image: core-service:latest
    container_name: core-service
    ports:
      - "8083:8083"
    expose:
      - "8083"
    networks:
      - backend

networks:
  backend:
    name: api-gateway-backend
