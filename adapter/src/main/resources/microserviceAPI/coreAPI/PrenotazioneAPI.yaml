openapi: 3.0.3

info:
  title: Prenotazione API
  version: 1.0.0
  description: API per la gestione delle prenotazioni.

servers:
  - url: https://api.example.com

paths:
  /prenotazioni:
    post:
      tags: [Prenotazioni]
      operationId: creaPrenotazione
      summary: Crea una nuova prenotazione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaPrenotazioneRequest'
      responses:
        '201':
          description: Prenotazione creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/by-data:
    get:
      tags: [Prenotazioni]
      operationId: prenotazioniByData
      summary: Recupera tutte le prenotazioni in un intervallo temporale
      parameters:
        - $ref: '#/components/parameters/dataInizio'
        - $ref: '#/components/parameters/dataFine'
      responses:
        '200':
          description: Elenco prenotazioni nel range richiesto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/{idPrenotazione}:
    delete:
      tags: [Prenotazioni]
      operationId: cancellaPrenotazione
      summary: Cancella una prenotazione
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      responses:
        '204':
          description: Prenotazione cancellata con successo

    patch:
      tags: [Prenotazioni]
      operationId: modificaPrenotazione
      summary: Modifica una prenotazione
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaPrenotazioneRequest'
      responses:
        '200':
          description: Prenotazione modificata con successo

    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioneById
      summary: Cerca una prenotazione per ID
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      responses:
        '200':
          description: Prenotazione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/cercaPrenotazioneByIdUtente/{idUtente}:
    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioneByIdUtente
      summary: Cerca una prenotazione per ID Utente
      parameters:
        - $ref: '#/components/parameters/idUtente'
      responses:
        '200':
          description: Prenotazione trovata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'

  /eventi/{idEvento}/prenotazioni:
    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioniPerEvento
      summary: Cerca tutte le prenotazioni per uno specifico evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Elenco prenotazioni per evento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'

  /eventi/{idEvento}/prenotazioni/disponibili:
    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioniDisponibiliPerEvento
      summary: Recupera il numero di posti disponibili per un evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Numero di posti disponibili per l'evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrenotazioniDisponibiliEvento'
        '404':
          description: Evento non trovato

components:
  parameters:
    idPrenotazione:
      name: idPrenotazione
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123456789

    idEvento:
      name: idEvento
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123466789

    idUtente:
      name: idUtente
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123456789

    dataInizio:
      name: dataInizio
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DataCreazione'

    dataFine:
      name: dataFine
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DataCreazione'

  schemas:
    IdMin1000:
      type: integer
      minimum: 1000
      nullable: false
      example: 123456789

    NumeroPartecipanti:
      type: integer
      minimum: 2
      nullable: false
      example: 2

    DataCreazione:
      type: string
      format: date-time
      example: '2024-06-01T12:00:00Z'

    DataUltimaModifica:
      type: string
      format: date-time
      example: '2024-06-01T12:00:00Z'

    CreaPrenotazioneRequest:
      type: object
      additionalProperties: false
      required: [idUtente, idEvento, numeroPartecipanti]
      properties:
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'

    ModificaPrenotazioneRequest:
      type: object
      additionalProperties: false
      required: [numeroPartecipanti]
      properties:
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'

    Prenotazione:
      type: object
      additionalProperties: false
      required:
        - idPrenotazione
        - idUtente
        - idEvento
        - numeroPartecipanti
        - dataCreazione
        - dataUltimaModifica
      properties:
        idPrenotazione:
          $ref: '#/components/schemas/IdMin1000'
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'
        dataCreazione:
          $ref: '#/components/schemas/DataCreazione'
        dataUltimaModifica:
          $ref: '#/components/schemas/DataUltimaModifica'

    PrenotazioniDisponibiliEvento:
      type: object
      additionalProperties: false
      required:
        - idEvento
        - numeroPostiTotali
        - numeroPostiDispobili
      properties:
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPostiTotali:
          type: integer
          format: int32
          minimum: 0
        numeroPostiDispobili:
          type: integer
          format: int32
          minimum: 0