openapi: 3.0.3

info:
  title: Prenotazione API
  version: 1.0.0
  description: API per la gestione delle prenotazioni.


servers:
  - url: https://api.example.com

paths:
  /prenotazioni:
    post:
      operationId: creaPrenotazione
      summary: Crea una nuova prenotazione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaPrenotazioneRequest'
      responses:
        '201':
          description: Prenotazione creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/{idPrenotazione}:
    delete:
      operationId: cancellaPrenotazione
      summary: Cancella una prenotazione
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      responses:
        '204':
          description: Prenotazione cancellata con successo

    patch:
      operationId: modificaPrenotazione
      summary: Modifica una prenotazione
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaPrenotazioneRequest'
      responses:
        '200':
          description: Prenotazione modificata con successo

    get:
      operationId: cercaPrenotazioneById
      summary: Cerca una prenotazione per ID
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      responses:
        '200':
          description: Prenotazione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/cercaPrenotazioneByIdUtente/{idUtente}:
    get:
      operationId: cercaPrenotazioneByIdUtente
      summary: Cerca una prenotazione per ID Utente
      parameters:
        - $ref: '#/components/parameters/idUtente'
      responses:
        '200':
          description: Prenotazione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'

  /eventi/{idEvento}/prenotazioni:
    get:
      operationId: cercaPrenotazioniPerEvento
      summary: Cerca tutte le prenotazioni per uno specifico evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Elenco prenotazioni per evento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'

components:
  parameters:
    idPrenotazione:
      name: idPrenotazione
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123456789

    idEvento:
      name: idEvento
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123466789

    idUtente:
      name: idUtente
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123456789

  schemas:
    # Campo comune per tutti gli ID numerici >= 1000
    IdMin1000:
      type: integer
      minimum: 1000
      nullable: false
      example: 123456789

    # Campo comune per numeroPartecipanti > 1
    NumeroPartecipanti:
      type: integer
      minimum: 2
      nullable: false
      example: 2

    DataCreazione:
      type: string
      format: date-time
      example: '2024-06-01T12:00:00Z'

    DataUltimaModifica:
      type: string
      format: date-time
      example: '2024-06-01T12:00:00Z'

    CreaPrenotazioneRequest:
      type: object
      additionalProperties: false
      required:
        - idUtente
        - idEvento
        - numeroPartecipanti
      properties:
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'

    ModificaPrenotazioneRequest:
      type: object
      additionalProperties: false
      required:
        - numeroPartecipanti
      properties:
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'

    Prenotazione:
      type: object
      additionalProperties: false
      required:
        - idPrenotazione
        - idUtente
        - idEvento
        - numeroPartecipanti
        - dataCreazione
        - dataUltimaModifica
      properties:
        idPrenotazione:
          $ref: '#/components/schemas/IdMin1000'
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'
        dataCreazione:
          $ref: '#/components/schemas/DataCreazione'
        dataUltimaModifica:
          $ref: '#/components/schemas/DataUltimaModifica'