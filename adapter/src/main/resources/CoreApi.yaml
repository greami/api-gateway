    NumeroPartecipanti:
      type: integer
      minimum: 2
      nullable: false
      example: 2

    DataCreazione:
      type: string
      format: date-time
      example: '2024-06-01T12:00:00Z'

    DataUltimaModifica:
      type: string
      format: date-time
      example: '2024-06-01T12:00:00Z'

    CreaPrenotazioneRequest:
      type: object
      additionalProperties: false
      required: [idUtente, idEvento, numeroPartecipanti]
      properties:
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'

    ModificaPrenotazioneRequest:
      type: object
      additionalProperties: false
      required: [numeroPartecipanti]
      properties:
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'

    Prenotazione:
      type: object
      additionalProperties: false
      required:
        - idPrenotazione
        - idUtente
        - idEvento
        - numeroPartecipanti
        - dataCreazione
        - dataUltimaModifica
      properties:
        idPrenotazione:
          $ref: '#/components/schemas/IdMin1000'
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPartecipanti:
          $ref: '#/components/schemas/NumeroPartecipanti'
        dataCreazione:
          $ref: '#/components/schemas/DataCreazione'
        dataUltimaModifica:
          $ref: '#/components/schemas/DataUltimaModifica'

    PrenotazioniDisponibiliEvento:
      type: object
      additionalProperties: false
      required:
        - idEvento
        - numeroPostiTotali
        - numeroPostiDispobili
      properties:
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        numeroPostiTotali:
          type: integer
          format: int32
          minimum: 0
        numeroPostiDispobili:
          type: integer
          format: int32
          minimum: 0
