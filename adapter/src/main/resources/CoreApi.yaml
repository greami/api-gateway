          $ref: '#/components/schemas/Voto'
        note:
          $ref: '#/components/schemas/NoteFeedback'

    FeedbackOpere:
      type: object
      additionalProperties: false
      required:
        - idFeedback
        - idUtente
        - idOpera
        - voto
        - note
      properties:
        idFeedback:
          $ref: '#/components/schemas/IdMin1000'
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idOpera:
          $ref: '#/components/schemas/IdMin1000'
        voto:
          $ref: '#/components/schemas/Voto'
