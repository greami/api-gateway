openapi: 3.0.3

info:
  title: Core API
  version: 1.0.0
  description: API unificata per eventi, opere, associazioni, feedback e prenotazioni.

servers:
  - url: https://api.example.com

tags:
  - name: Eventi
  - name: Opere
  - name: EventoOpera
  - name: FeedbackEventi
  - name: FeedbackOpere
  - name: Prenotazioni

paths:
  /eventi:
    get:
      tags: [Eventi]
      operationId: eventiAll
      summary: Recupera tutti gli eventi
      responses:
        '200':
          description: Elenco completo degli eventi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'

    post:
      tags: [Eventi]
      operationId: creaEvento
      summary: Crea un nuovo evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaEventoRequest'
      responses:
        '201':
          description: Evento creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'

  /eventi/by-data:
    get:
      tags: [Eventi]
      operationId: eventiByData
      summary: Recupera tutti gli eventi in un intervallo temporale
      parameters:
        - $ref: '#/components/parameters/dataInizio'
        - $ref: '#/components/parameters/dataFine'
      responses:
        '200':
          description: Elenco eventi nel range richiesto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'

  /eventi/by-nome/{nomeEvento}:
    get:
      tags: [Eventi]
      operationId: cercaEventoByNome
      summary: Cerca eventi per nome
      parameters:
        - $ref: '#/components/parameters/nomeEvento'
      responses:
        '200':
          description: Elenco eventi trovati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'

  /eventi/{idEvento}:
    delete:
      tags: [Eventi]
      operationId: cancellaEvento
      summary: Cancella un evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '204':
          description: Evento cancellato con successo

    patch:
      tags: [Eventi]
      operationId: modificaEvento
      summary: Modifica un evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaEventoRequest'
      responses:
        '200':
          description: Evento modificato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'

    get:
      tags: [Eventi]
      operationId: cercaEvento
      summary: Cerca un evento per ID
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Evento trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'

  /opere:
    get:
      tags: [Opere]
      operationId: opereAll
      summary: Recupera tutte le opere
      responses:
        '200':
          description: Elenco completo delle opere
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Opera'

    post:
      tags: [Opere]
      operationId: creaOpera
      summary: Crea una nuova opera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaOperaRequest'
      responses:
        '201':
          description: Opera creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opera'

  /opere/by-evento/{idEvento}:
    get:
      tags: [Opere]
      operationId: cercaOpereByIdEvento
      summary: Cerca tutte le opere collegate a un evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Elenco opere collegate a un evento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Opera'

  /opere/by-nome/{nomeOpera}:
    get:
      tags: [Opere]
      operationId: cercaOpereByNome
      summary: Cerca opere per nome
      parameters:
        - $ref: '#/components/parameters/nomeOpera'
      responses:
        '200':
          description: Elenco opere trovate per nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Opera'

  /opere/by-autore/{autoreOpera}:
    get:
      tags: [Opere]
      operationId: cercaOpereByAutore
      summary: Cerca opere per autore
      parameters:
        - $ref: '#/components/parameters/autoreOpera'
      responses:
        '200':
          description: Elenco opere trovate per autore
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Opera'

  /opere/{idOpera}:
    delete:
      tags: [Opere]
      operationId: cancellaOpera
      summary: Cancella un'opera
      parameters:
        - $ref: '#/components/parameters/idOpera'
      responses:
        '204':
          description: Opera cancellata con successo

    patch:
      tags: [Opere]
      operationId: modificaOpera
      summary: Modifica un'opera
      parameters:
        - $ref: '#/components/parameters/idOpera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaOperaRequest'
      responses:
        '200':
          description: Opera modificata con successo

    get:
      tags: [Opere]
      operationId: cercaOperaById
      summary: Cerca un'opera per ID
      parameters:
        - $ref: '#/components/parameters/idOpera'
      responses:
        '200':
          description: Opera trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opera'

  /evento-opera:
    post:
      tags: [EventoOpera]
      operationId: creaEventoOpera
      summary: Crea una nuova associazione evento-opera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaEventoOperaRequest'
      responses:
        '201':
          description: Associazione creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoOpera'

  /evento-opera/{idEvento}/{idOpera}:
    delete:
      tags: [EventoOpera]
      operationId: cancellaEventoOpera
      summary: Cancella una associazione evento-opera
      parameters:
        - $ref: '#/components/parameters/idEvento'
        - $ref: '#/components/parameters/idOpera'
      responses:
        '204':
          description: Associazione cancellata con successo

    patch:
      tags: [EventoOpera]
      operationId: modificaEventoOpera
      summary: Modifica una associazione evento-opera
      parameters:
        - $ref: '#/components/parameters/idEvento'
        - $ref: '#/components/parameters/idOpera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaEventoOperaRequest'
      responses:
        '200':
          description: Associazione modificata con successo

    get:
      tags: [EventoOpera]
      operationId: cercaEventoOperaById
      summary: Cerca una associazione evento-opera per chiave composta
      parameters:
        - $ref: '#/components/parameters/idEvento'
        - $ref: '#/components/parameters/idOpera'
      responses:
        '200':
          description: Associazione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoOpera'

  /eventi/{idEvento}/opere:
    get:
      tags: [EventoOpera]
      operationId: cercaOperePerEvento
      summary: Cerca tutte le opere collegate a un evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Elenco associazioni evento-opera per evento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoOpera'

  /opere/{idOpera}/eventi:
    get:
      tags: [EventoOpera]
      operationId: cercaEventiPerOpera
      summary: Cerca tutti gli eventi collegati a una opera
      parameters:
        - $ref: '#/components/parameters/idOpera'
      responses:
        '200':
          description: Elenco associazioni evento-opera per opera
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoOpera'

  /feedback-eventi:
    post:
      tags: [FeedbackEventi]
      operationId: creaFeedbackEvento
      summary: Crea un nuovo feedback evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaFeedbackEventiRequest'
      responses:
        '201':
          description: Feedback creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEventi'

  /feedback-eventi/{idFeedback}:
    delete:
      tags: [FeedbackEventi]
      operationId: cancellaFeedbackEvento
      summary: Cancella un feedback evento
      parameters:
        - $ref: '#/components/parameters/idFeedback'
      responses:
        '204':
          description: Feedback cancellato con successo

    patch:
      tags: [FeedbackEventi]
      operationId: modificaFeedbackEvento
      summary: Modifica un feedback evento
      parameters:
        - $ref: '#/components/parameters/idFeedback'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaFeedbackEventiRequest'
      responses:
        '200':
          description: Feedback modificato con successo

    get:
      tags: [FeedbackEventi]
      operationId: cercaFeedbackEventoById
      summary: Cerca un feedback evento per ID
      parameters:
        - $ref: '#/components/parameters/idFeedback'
      responses:
        '200':
          description: Feedback trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEventi'

  /feedback-eventi/cercaFeedbackEventoByIdUtente/{idUtente}:
    get:
      tags: [FeedbackEventi]
      operationId: cercaFeedbackEventoByIdUtente
      summary: Cerca i feedback evento per ID Utente
      parameters:
        - $ref: '#/components/parameters/idUtente'
      responses:
        '200':
          description: Elenco feedback per utente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackEventi'

  /eventi/{idEvento}/feedback-eventi:
    get:
      tags: [FeedbackEventi]
      operationId: cercaFeedbackEventiPerEvento
      summary: Cerca i feedback per un evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Elenco feedback per evento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackEventi'

  /feedback-opere:
    post:
      tags: [FeedbackOpere]
      operationId: creaFeedbackOpera
      summary: Crea un nuovo feedback opera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaFeedbackOpereRequest'
      responses:
        '201':
          description: Feedback creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOpere'

  /feedback-opere/{idFeedback}:
    delete:
      tags: [FeedbackOpere]
      operationId: cancellaFeedbackOpera
      summary: Cancella un feedback opera
      parameters:
        - $ref: '#/components/parameters/idFeedback'
      responses:
        '204':
          description: Feedback cancellato con successo

    patch:
      tags: [FeedbackOpere]
      operationId: modificaFeedbackOpera
      summary: Modifica un feedback opera
      parameters:
        - $ref: '#/components/parameters/idFeedback'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaFeedbackOpereRequest'
      responses:
        '200':
          description: Feedback modificato con successo

    get:
      tags: [FeedbackOpere]
      operationId: cercaFeedbackOperaById
      summary: Cerca un feedback opera per ID
      parameters:
        - $ref: '#/components/parameters/idFeedback'
      responses:
        '200':
          description: Feedback trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOpere'

  /feedback-opere/cercaFeedbackOperaByIdUtente/{idUtente}:
    get:
      tags: [FeedbackOpere]
      operationId: cercaFeedbackOperaByIdUtente
      summary: Cerca i feedback opera per ID Utente
      parameters:
        - $ref: '#/components/parameters/idUtente'
      responses:
        '200':
          description: Elenco feedback per utente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackOpere'

  /opere/{idOpera}/feedback-opere:
    get:
      tags: [FeedbackOpere]
      operationId: cercaFeedbackOperePerOpera
      summary: Cerca i feedback per una opera
      parameters:
        - $ref: '#/components/parameters/idOpera'
      responses:
        '200':
          description: Elenco feedback per opera
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackOpere'

  /prenotazioni:
    post:
      tags: [Prenotazioni]
      operationId: creaPrenotazione
      summary: Crea una nuova prenotazione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreaPrenotazioneRequest'
      responses:
        '201':
          description: Prenotazione creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/by-data:
    get:
      tags: [Prenotazioni]
      operationId: prenotazioniByData
      summary: Recupera tutte le prenotazioni in un intervallo temporale
      parameters:
        - $ref: '#/components/parameters/dataInizio'
        - $ref: '#/components/parameters/dataFine'
      responses:
        '200':
          description: Elenco prenotazioni nel range richiesto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/{idPrenotazione}:
    delete:
      tags: [Prenotazioni]
      operationId: cancellaPrenotazione
      summary: Cancella una prenotazione
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      responses:
        '204':
          description: Prenotazione cancellata con successo

    patch:
      tags: [Prenotazioni]
      operationId: modificaPrenotazione
      summary: Modifica una prenotazione
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaPrenotazioneRequest'
      responses:
        '200':
          description: Prenotazione modificata con successo

    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioneById
      summary: Cerca una prenotazione per ID
      parameters:
        - $ref: '#/components/parameters/idPrenotazione'
      responses:
        '200':
          description: Prenotazione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'

  /prenotazioni/cercaPrenotazioneByIdUtente/{idUtente}:
    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioneByIdUtente
      summary: Cerca una prenotazione per ID Utente
      parameters:
        - $ref: '#/components/parameters/idUtente'
      responses:
        '200':
          description: Prenotazione trovata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'

  /eventi/{idEvento}/prenotazioni:
    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioniPerEvento
      summary: Cerca tutte le prenotazioni per uno specifico evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Elenco prenotazioni per evento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'

  /eventi/{idEvento}/prenotazioni/disponibili:
    get:
      tags: [Prenotazioni]
      operationId: cercaPrenotazioniDisponibiliPerEvento
      summary: Recupera il numero di posti disponibili per un evento
      parameters:
        - $ref: '#/components/parameters/idEvento'
      responses:
        '200':
          description: Numero di posti disponibili per l'evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrenotazioniDisponibiliEvento'
        '404':
          description: Evento non trovato

components:
  parameters:
    idEvento:
      name: idEvento
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdEvento'
      example: 123456789

    idOpera:
      name: idOpera
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdOpera'
      example: 123456790

    nomeOpera:
      name: nomeOpera
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NomeOpera'

    autoreOpera:
      name: autoreOpera
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AutoreOpera'

    idFeedback:
      name: idFeedback
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123456789

    idUtente:
      name: idUtente
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123456780

    idPrenotazione:
      name: idPrenotazione
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdMin1000'
      example: 123456789

    dataInizio:
      name: dataInizio
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DataEvento'

    dataFine:
      name: dataFine
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DataEvento'

    nomeEvento:
      name: nomeEvento
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NomeEvento'

  schemas:
    IdMin1000:
      type: integer
      minimum: 1000
      nullable: false
      example: 123456789

    IdEvento:
      type: integer
      minimum: 1000
      nullable: false
      example: 123456789

    NomeEvento:
      type: string
      minLength: 1000
      nullable: false
      example: "123456789"

    NumeroPosti:
      type: integer
      nullable: false
      example: 30

    DataEvento:
      type: string
      format: date-time
      nullable: false
      example: "2026-07-27T10:30:00Z"

    DurataEvento:
      type: integer
      nullable: false
      example: 8

    EventoCampiComuni:
      type: object
      additionalProperties: false
      required:
        - numeroPosti
        - data
        - durata
      properties:
        numeroPosti:
          $ref: '#/components/schemas/NumeroPosti'
        data:
          $ref: '#/components/schemas/DataEvento'
        durata:
          $ref: '#/components/schemas/DurataEvento'

    CreaEventoRequest:
      allOf:
        - $ref: '#/components/schemas/EventoCampiComuni'
        - type: object
          additionalProperties: false
          required:
            - Nome
          properties:
            Nome:
              $ref: '#/components/schemas/NomeEvento'

    ModificaEventoRequest:
      allOf:
        - $ref: '#/components/schemas/EventoCampiComuni'
        - type: object
          additionalProperties: false
          required:
            - idEvento
            - nome
          properties:
            idEvento:
              $ref: '#/components/schemas/IdEvento'
            nome:
              $ref: '#/components/schemas/NomeEvento'

    Evento:
      type: object
      additionalProperties: false
      required:
        - idEvento
        - nome
        - numeroPosti
        - data
        - durata
      properties:
        idEvento:
          $ref: '#/components/schemas/IdEvento'
        nome:
          $ref: '#/components/schemas/NomeEvento'
        numeroPosti:
          $ref: '#/components/schemas/NumeroPosti'
        data:
          $ref: '#/components/schemas/DataEvento'
        durata:
          $ref: '#/components/schemas/DurataEvento'

    IdOpera:
      type: integer
      minimum: 1000
      nullable: false
      example: 123456789

    NomeOpera:
      type: string
      minLength: 1
      nullable: false
      example: "Guernica"

    AutoreOpera:
      type: string
      nullable: false
      example: "Italo Calvino"

    TipoOpera:
      type: integer
      nullable: false
      example: 1

    CreaOperaRequest:
      type: object
      additionalProperties: false
      required: [nome, autore, tipo]
      properties:
        nome:
          $ref: '#/components/schemas/NomeOpera'
        autore:
          $ref: '#/components/schemas/AutoreOpera'
        tipo:
          $ref: '#/components/schemas/TipoOpera'

    ModificaOperaRequest:
      type: object
      additionalProperties: false
      required: [nome, autore, tipo]
      properties:
        nome:
          $ref: '#/components/schemas/NomeOpera'
        autore:
          $ref: '#/components/schemas/AutoreOpera'
        tipo:
          $ref: '#/components/schemas/TipoOpera'

    Opera:
      type: object
      additionalProperties: false
      required:
        - idOpera
        - nome
        - autore
        - tipo
      properties:
        idOpera:
          $ref: '#/components/schemas/IdOpera'
        nome:
          $ref: '#/components/schemas/NomeOpera'
        autore:
          $ref: '#/components/schemas/AutoreOpera'
        tipo:
          $ref: '#/components/schemas/TipoOpera'

    CreaEventoOperaRequest:
      type: object
      additionalProperties: false
      required: [idEvento, idOpera]
      properties:
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        idOpera:
          $ref: '#/components/schemas/IdMin1000'

    ModificaEventoOperaRequest:
      type: object
      additionalProperties: false
      required: [idOperaNuova]
      properties:
        idOperaNuova:
          $ref: '#/components/schemas/IdMin1000'

    EventoOpera:
      type: object
      additionalProperties: false
      required:
        - idEvento
        - idOpera
      properties:
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        idOpera:
          $ref: '#/components/schemas/IdMin1000'

    Voto:
      type: integer
      minimum: 1
      maximum: 5
      nullable: false
      example: 5

    NoteFeedback:
      type: string
      minLength: 1
      nullable: false
      example: "Analisi curata e molto utile."

    CreaFeedbackEventiRequest:
      type: object
      additionalProperties: false
      required: [idUtente, idEvento, voto, note]
      properties:
        idUtente:
          $ref: '#/components/schemas/IdMin1000'
        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        voto:
          $ref: '#/components/schemas/Voto'
        note:
          $ref: '#/components/schemas/NoteFeedback'

    ModificaFeedbackEventiRequest:
      type: object
      additionalProperties: false
      required: [voto, note]
      properties:
        voto:
          $ref: '#/components/schemas/Voto'
        note:
          $ref: '#/components/schemas/NoteFeedback'

    FeedbackEventi:
      type: object
