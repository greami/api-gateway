        idEvento:
          $ref: '#/components/schemas/IdMin1000'
        voto:
          $ref: '#/components/schemas/Voto'
        note:
          $ref: '#/components/schemas/NoteFeedback'

    CreaFeedbackOpereRequest:
      type: object
      additionalProperties: false
